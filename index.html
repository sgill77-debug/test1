<html lang="en">
<head>

  <title>VeritasAI Studio - Multimodal Forensics & Integrity Suite</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    .tab-btn.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 4px 14px -2px rgba(99, 102, 241, 0.4);

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 py-3 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-600/30">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight">Veritas<span class="text-indigo-400">AI</span></h1>
          <p class="text-[11px] text-slate-400">Multimodal Forensics, Verification & Editorial Suite</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="exportReportPdf()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="file-down" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span>Export PDF</span>
        </button>
        <button type="button" onclick="resetAll()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>Reset</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
    
    <!-- Left Workspace (7 Columns) -->
    <section class="lg:col-span-7 flex flex-col gap-4">
      
      <!-- Multimodal Tab Bar -->
      <nav class="grid grid-cols-3 sm:grid-cols-6 gap-1 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
