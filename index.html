<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeritasAI Studio - Fact Verification</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    .bg-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-500 selection:text-white bg-grid relative">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-600 to-orange-400 flex items-center justify-center text-white shadow-lg shadow-amber-500/25">
          <i data-lucide="check-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-white">Veritas<span class="text-amber-400">AI</span></h1>
          <p class="text-[11px] text-slate-400">Global Fact & Evidence Verification</p>
        </div>
      </div>

      <button type="button" id="resetBtn" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs font-semibold text-slate-400 border border-slate-800 transition flex items-center gap-1.5 active:scale-95">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full flex flex-col gap-6">
    
    <!-- Input Section -->
    <div class="flex flex-col gap-2">
      <textarea
        id="factInput"
        rows="4"
        placeholder="Enter statement, news headline, or claim to verify (e.g., 'The Eiffel Tower was completed in 1889 in Paris' or 'CERN operates the Large Hadron Collider')..."
        class="w-full bg-slate-900/90 border border-slate-800 focus:border-amber-500/60 rounded-2xl p-4 text-xs font-mono text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/20 leading-relaxed resize-y transition shadow-inner"
      ></textarea>

      <button type="button" id="verifyFactBtn" class="flex items-center justify-center gap-2 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-amber-600/25 transition active:scale-[0.99] text-xs sm:text-sm">
        <i data-lucide="search-check" class="w-4 h-4"></i> Cross-Reference All Available Sources
      </button>
    </div>

    <!-- The Single Answer Box (Permanent on Screen) -->
    <div id="answerBox" class="bg-slate-900/95 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Status</span>
          <span id="sourceOriginBadge" class="hidden text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700"></span>
        </div>
        <span id="verdictStatus" class="text-xs font-black px-3.5 py-1.5 rounded-lg border tracking-wider bg-slate-800 text-slate-400 border-slate-700">
          AWAITING INPUT
        </span>
      </div>
      
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">Correct Answer</span>
        <p id="verifiedAnswer" class="text-sm font-mono text-slate-300 bg-slate-950/90 border border-slate-800/90 rounded-xl p-4 leading-relaxed min-h-[72px]">
          Enter a statement above and click "Cross-Reference All Available Sources" to verify against live encyclopedias, open library archives, live news indexes, and global structured entities.
        </p>
      </div>

      <div id="sourceRow" class="flex items-center justify-between pt-1 text-xs">
        <span id="matchedEntity" class="font-mono text-slate-500 text-[11px]"></span>
        <a id="sourceAnchor" href="#" target="_blank" rel="noopener noreferrer" class="hidden font-bold text-amber-400 hover:text-amber-300 flex items-center gap-1 transition">
          View Primary Source <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        </a>
      </div>
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      const factInput = document.getElementById('factInput');
      const verifyFactBtn = document.getElementById('verifyFactBtn');
      const verdictStatus = document.getElementById('verdictStatus');
      const verifiedAnswer = document.getElementById('verifiedAnswer');
      const sourceOriginBadge = document.getElementById('sourceOriginBadge');
      const matchedEntity = document.getElementById('matchedEntity');
      const sourceAnchor = document.getElementById('sourceAnchor');
      const resetBtn = document.getElementById('resetBtn');

      // 1. Wikipedia / MediaWiki OpenSearch
      async function queryWikipedia(query) {
        try {
          const res = await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&namespace=0&format=json&origin=*`);
          const data = await res.json();
          if (data[1] && data[1][0] && data[2] && data[2][0] && data[2][0].trim().length > 0) {
            return {
              origin: 'Wikipedia Encyclopedic Record',
              title: data[1][0],
              answer: data[2][0],
              url: data[3][0]
            };
          }
        } catch (e) { console.warn('Wiki lookup skipped', e); }
        return null;
      }

      // 2. Wikidata Global Knowledge Base
      async function queryWikidata(query) {
        try {
          const res = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=en&format=json&origin=*`);
          const data = await res.json();
          if (data.search && data.search.length > 0 && data.search[0].description) {
            const item = data.search[0];
            return {
              origin: 'Wikidata Global Knowledge Base',
              title: item.label,
              answer: `${item.label}: ${item.description}.`,
              url: `https://www.wikidata.org/wiki/${item.id}`
            };
          }
        } catch (e) { console.warn('Wikidata lookup skipped', e); }
        return null;
      }

      // 3. Internet Archive / Open Library (Books, Literature, Authors)
      async function queryOpenLibrary(query) {
        try {
          const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=1`);
          const data = await res.json();
          if (data.docs && data.docs.length > 0) {
            const doc = data.docs[0];
            const author = doc.author_name ? doc.author_name.join(', ') : 'Documented Author';
            const year = doc.first_publish_year ? ` (first published ${doc.first_publish_year})` : '';
            return {
              origin: 'Internet Archive / Open Library',
              title: doc.title,
              answer: `"${doc.title}" written by ${author}${year}. Cataloged in public open library archive.`,
              url: `https://openlibrary.org${doc.key}`
            };
          }
        } catch (e) { console.warn('OpenLibrary lookup skipped', e); }
        return null;
      }

      // 4. DuckDuckGo Instant Answer API (Broad Web, Definitions & Official Topics)
      async function queryDuckDuckGo(query) {
        try {
          const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
          const data = await res.json();
          const answer = data.Answer || data.AbstractText || (data.RelatedTopics && data.RelatedTopics[0] && data.RelatedTopics[0].Text);
          const url = data.AbstractURL || (data.RelatedTopics && data.RelatedTopics[0] && data.RelatedTopics[0].FirstURL);
          const heading = data.Heading || query;
          if (answer && answer.trim().length > 0) {
            return {
              origin: 'Web & Reference Instant Knowledge',
              title: heading,
              answer: answer,
              url: url || null
            };
          }
        } catch (e) { console.warn('DuckDuckGo lookup skipped', e); }
        return null;
      }

      // 5. Public News & Media Archives (Hacker News Algolia Global News/Web Index)
      async function queryNewsWebIndex(query) {
        try {
          const res = await fetch(`https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&tags=story&hitsPerPage=1`);
          const data = await res.json();
          if (data.hits && data.hits.length > 0) {
            const hit = data.hits[0];
            const date = hit.created_at ? new Date(hit.created_at).toLocaleDateString() : '';
            return {
              origin: 'Public Media & Web Archive',
              title: hit.title,
              answer: `Reported Event / Media Coverage: "${hit.title}" (${date}). Points: ${hit.points || 0}.`,
              url: hit.url || `https://news.ycombinator.com/item?id=${hit.objectID}`
            };
          }
        } catch (e) { console.warn('News search skipped', e); }
        return null;
      }

      if (verifyFactBtn) {
        verifyFactBtn.addEventListener('click', async () => {
          const query = factInput.value.trim();
          if (!query) {
            alert('Please enter a statement, news item, or claim to verify.');
            return;
          }

          verifyFactBtn.disabled = true;
          verifyFactBtn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Searching All Open Sources...`;
          if (window.lucide) lucide.createIcons();

          // Extract key subject tokens
          const searchTerms = query.replace(/[^\w\s]/gi, '')
            .split(/\s+/)
            .filter(w => w.length > 2 && (w[0] === w[0].toUpperCase() || /\d/.test(w)))
            .slice(0, 4)
            .join(' ') || query.split(/\s+/).slice(0, 3).join(' ');

          try {
            // Check all sources concurrently across the web
            const [wikiRes, ddgRes, wikidataRes, openLibRes, newsRes] = await Promise.all([
              queryWikipedia(searchTerms),
              queryDuckDuckGo(searchTerms),
              queryWikidata(searchTerms),
              queryOpenLibrary(searchTerms),
              queryNewsWebIndex(searchTerms)
            ]);

            // Select highest fidelity corroboration
            const result = wikiRes || ddgRes || wikidataRes || openLibRes || newsRes;

            if (result && result.answer) {
              verdictStatus.textContent = 'TRUE';
              verdictStatus.className = 'text-xs font-black px-4 py-1.5 rounded-lg border tracking-wider bg-emerald-950 text-emerald-300 border-emerald-700 shadow-sm';
              verifiedAnswer.textContent = result.answer;
              matchedEntity.textContent = `Corroborated Subject: ${result.title}`;
              
              if (sourceOriginBadge) {
                sourceOriginBadge.textContent = result.origin;
                sourceOriginBadge.classList.remove('hidden');
              }

              if (result.url) {
                sourceAnchor.href = result.url;
                sourceAnchor.classList.remove('hidden');
              } else {
                sourceAnchor.classList.add('hidden');
              }
            } else {
              verdictStatus.textContent = 'FALSE / UNVERIFIED';
              verdictStatus.className = 'text-xs font-black px-4 py-1.5 rounded-lg border tracking-wider bg-rose-950 text-rose-300 border-rose-700 shadow-sm';
              verifiedAnswer.textContent = `No reliable records across open encyclopedias, news archives, or web indices corroborate this assertion.`;
              matchedEntity.textContent = `Searched: "${searchTerms}"`;
              
              if (sourceOriginBadge) {
                sourceOriginBadge.textContent = 'Searched All Web Sources';
                sourceOriginBadge.classList.remove('hidden');
              }
              sourceAnchor.classList.add('hidden');
            }
          } catch (err) {
            alert('Lookup failed: ' + err.message);
          } finally {
            verifyFactBtn.disabled = false;
            verifyFactBtn.innerHTML = `<i data-lucide="search-check" class="w-4 h-4"></i> Cross-Reference All Available Sources`;
            if (window.lucide) lucide.createIcons();
          }
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          factInput.value = '';
          verdictStatus.textContent = 'AWAITING INPUT';
          verdictStatus.className = 'text-xs font-black px-3.5 py-1.5 rounded-lg border tracking-wider bg-slate-800 text-slate-400 border-slate-700';
          verifiedAnswer.textContent = 'Enter a statement above and click "Cross-Reference All Available Sources" to verify against live encyclopedias, open library archives, live news indexes, and global structured entities.';
          matchedEntity.textContent = '';
          if (sourceOriginBadge) sourceOriginBadge.classList.add('hidden');
          sourceAnchor.classList.add('hidden');
        });
      }
    });
  </script>
</body>
</html>
