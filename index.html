<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeritasAI Studio - Fact Verification</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    .bg-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-500 selection:text-white bg-grid relative">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-600 to-orange-400 flex items-center justify-center text-white shadow-lg shadow-amber-500/25">
          <i data-lucide="check-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-white">Veritas<span class="text-amber-400">AI</span></h1>
          <p class="text-[11px] text-slate-400">Claim Verification Engine</p>
        </div>
      </div>

      <button type="button" id="resetBtn" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs font-semibold text-slate-400 border border-slate-800 transition flex items-center gap-1.5 active:scale-95">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full flex flex-col gap-6">
    
    <!-- Input Field -->
    <div class="flex flex-col gap-2">
      <textarea
        id="factInput"
        rows="4"
        placeholder="Enter statement or claim here (e.g., 'The Eiffel Tower was completed in 1889 in Paris')..."
        class="w-full bg-slate-900/90 border border-slate-800 focus:border-amber-500/60 rounded-2xl p-4 text-xs font-mono text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/20 leading-relaxed resize-y transition shadow-inner"
      ></textarea>

      <button type="button" id="verifyFactBtn" class="flex items-center justify-center gap-2 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-amber-600/25 transition active:scale-[0.99] text-xs sm:text-sm">
        <i data-lucide="search-check" class="w-4 h-4"></i> Check Claim
      </button>
    </div>

    <!-- The Single Answer Box (Always Visible) -->
    <div id="answerBox" class="bg-slate-900/95 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
        <span class="text-[11px] font-bold tracking-wider text-slate-400 uppercase">Status</span>
        <span id="verdictStatus" class="text-xs font-black px-3.5 py-1.5 rounded-lg border tracking-wider bg-slate-800 text-slate-400 border-slate-700">
          AWAITING INPUT
        </span>
      </div>
      
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">Correct Answer</span>
        <p id="verifiedAnswer" class="text-sm font-mono text-slate-300 bg-slate-950/90 border border-slate-800/90 rounded-xl p-4 leading-relaxed min-h-[72px]">
          Enter a statement above and click "Check Claim" to display the verified answer.
        </p>
      </div>

      <div id="sourceRow" class="flex items-center justify-between pt-1 text-xs">
        <span id="matchedEntity" class="font-mono text-slate-500 text-[11px]"></span>
        <a id="sourceAnchor" href="#" target="_blank" rel="noopener noreferrer" class="hidden font-bold text-amber-400 hover:text-amber-300 flex items-center gap-1 transition">
          View Corroborating Source <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        </a>
      </div>
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();

      const factInput = document.getElementById('factInput');
      const verifyFactBtn = document.getElementById('verifyFactBtn');
      const verdictStatus = document.getElementById('verdictStatus');
      const verifiedAnswer = document.getElementById('verifiedAnswer');
      const matchedEntity = document.getElementById('matchedEntity');
      const sourceAnchor = document.getElementById('sourceAnchor');
      const resetBtn = document.getElementById('resetBtn');

      async function searchMediaWiki(queryTerms) {
        try {
          const res = await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(queryTerms)}&limit=1&namespace=0&format=json&origin=*`);
          const data = await res.json();
          if (data[1] && data[1][0] && data[2] && data[2][0]) {
            return {
              title: data[1][0],
              answer: data[2][0],
              url: data[3][0]
            };
          }
        } catch (e) { console.warn(e); }
        return null;
      }

      async function searchWikidata(queryTerms) {
        try {
          const res = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(queryTerms)}&language=en&format=json&origin=*`);
          const data = await res.json();
          if (data.search && data.search.length > 0 && data.search[0].description) {
            const item = data.search[0];
            return {
              title: item.label,
              answer: `${item.label}: ${item.description}.`,
              url: `https://www.wikidata.org/wiki/${item.id}`
            };
          }
        } catch (e) { console.warn(e); }
        return null;
      }

      async function searchOpenLibrary(queryTerms) {
        try {
          const res = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(queryTerms)}&limit=1`);
          const data = await res.json();
          if (data.docs && data.docs.length > 0) {
            const doc = data.docs[0];
            const author = doc.author_name ? doc.author_name.join(', ') : 'Documented Author';
            const year = doc.first_publish_year ? ` (first published ${doc.first_publish_year})` : '';
            return {
              title: doc.title,
              answer: `"${doc.title}" written by ${author}${year}.`,
              url: `https://openlibrary.org${doc.key}`
            };
          }
        } catch (e) { console.warn(e); }
        return null;
      }

      if (verifyFactBtn) {
        verifyFactBtn.addEventListener('click', async () => {
          const query = factInput.value.trim();
          if (!query) {
            alert('Please enter a statement or claim to verify.');
            return;
          }

          verifyFactBtn.disabled = true;
          verifyFactBtn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Checking Verification Sources...`;
          if (window.lucide) lucide.createIcons();

          const searchTerms = query.replace(/[^\w\s]/gi, '')
            .split(/\s+/)
            .filter(w => w.length > 2 && (w[0] === w[0].toUpperCase() || /\d/.test(w)))
            .slice(0, 4)
            .join(' ') || query.split(/\s+/).slice(0, 3).join(' ');

          try {
            let result = await searchMediaWiki(searchTerms);
            if (!result) result = await searchWikidata(searchTerms);
            if (!result) result = await searchOpenLibrary(searchTerms);

            if (result && result.answer) {
              verdictStatus.textContent = 'TRUE';
              verdictStatus.className = 'text-xs font-black px-4 py-1.5 rounded-lg border tracking-wider bg-emerald-950 text-emerald-300 border-emerald-700 shadow-sm';
              verifiedAnswer.textContent = result.answer;
              matchedEntity.textContent = `Corroborated Subject: ${result.title}`;
              
              if (result.url) {
                sourceAnchor.href = result.url;
                sourceAnchor.classList.remove('hidden');
              } else {
                sourceAnchor.classList.add('hidden');
              }
            } else {
              verdictStatus.textContent = 'FALSE / UNVERIFIED';
              verdictStatus.className = 'text-xs font-black px-4 py-1.5 rounded-lg border tracking-wider bg-rose-950 text-rose-300 border-rose-700 shadow-sm';
              verifiedAnswer.textContent = `No reliable records corroborate this statement. The claim could not be matched against verified encyclopedic or historical entries.`;
              matchedEntity.textContent = `Searched: "${searchTerms}"`;
              sourceAnchor.classList.add('hidden');
            }
          } catch (err) {
            alert('Lookup failed: ' + err.message);
          } finally {
            verifyFactBtn.disabled = false;
            verifyFactBtn.innerHTML = `<i data-lucide="search-check" class="w-4 h-4"></i> Check Claim`;
            if (window.lucide) lucide.createIcons();
          }
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          factInput.value = '';
          verdictStatus.textContent = 'AWAITING INPUT';
          verdictStatus.className = 'text-xs font-black px-3.5 py-1.5 rounded-lg border tracking-wider bg-slate-800 text-slate-400 border-slate-700';
          verifiedAnswer.textContent = 'Enter a statement above and click "Check Claim" to display the verified answer.';
          matchedEntity.textContent = '';
          sourceAnchor.classList.add('hidden');
        });
      }
    });
  </script>
</body>
</html>
